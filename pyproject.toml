[project]
name = "ml-production-project"
version = "0.1.0"
description = "From Notebook to Production Python ML Classification Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "ipykernel>=6.29.0",
    "joblib>=1.4.0",
    "jupyter>=1.1.0",
    "pandas>=2.2.0",
    "pydantic>=2.14.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.5.0",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]
[tool.ruff]
ignore = ["E501", "BLE001", "PLW1508"]